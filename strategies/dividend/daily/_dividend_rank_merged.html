let sortKey = "total", sortDir = -1; // 默认按总分降序

function disp(r, c){
  let v = r[c.k];
  if (c.k === "dy") return v==null ? "—" : (v+"%");
  if (c.k === "pePct") return v==null ? "—" : (v+"%");
  if (c.k === "pctS" && r.pctStar) return v+"*";
  if (v==null) return "—";
  return v;
}
function valOf(r, c){ return r[c.k]==null ? (sortDir===-1 ? -Infinity : Infinity) : r[c.k]; }

function opClass(op){ if(op.includes("加")) return "op-buy"; if(op.includes("减")||op.includes("规避")) return "op-cut"; return "op-mid"; }
function qualClass(q){
  if(q.includes("低估")||q.includes("偏低")) return "qual-low";
  if(q.includes("高估")||q.includes("偏高")) return "qual-high";
  return "";
}

function render(){
  // header
  const h = document.getElementById("h");
  h.innerHTML = "";
  COLS.forEach(c=>{
    const th = document.createElement("th");
    if(c.a==="l") th.className="l";
    if(c.g) th.classList.add(c.g);
    const ar = (c.k===sortKey) ? (sortDir===-1?" ▼":" ▲") : "";
    th.innerHTML = c.t + '<span class="ar">'+ar+'</span>';
    th.onclick = ()=>{
      if(sortKey===c.k){ sortDir = -sortDir; }
      else { sortKey = c.k; sortDir = (c.ty==="num") ? -1 : 1; }
      render();
    };
    h.appendChild(th);
  });
  // body
  const rows = R.slice().sort((a,b)=>{
    const ca = COLS.find(c=>c.k===sortKey);
    const va = valOf(a, ca), vb = valOf(b, ca);
    if(va<vb) return -1*sortDir;
    if(va>vb) return 1*sortDir;
    return 0;
  });
  const b = document.getElementById("b");
  b.innerHTML = "";
  rows.forEach(r=>{
    const tr = document.createElement("tr");
    COLS.forEach(c=>{
      const td = document.createElement("td");
      if(c.a==="l") td.className="l";
      if(c.g) td.classList.add(c.g);
      const txt = disp(r,c);
      if(txt==="—") td.classList.add("null");
      if(c.k==="code") td.innerHTML = '<span class="code">'+txt+'</span>';
      else if(c.k==="nm") td.innerHTML = '<span class="nm">'+txt+'</span>';
      else if(c.k==="op") td.innerHTML = '<span class="'+opClass(r.op)+'">'+txt+'</span>';
      else if(c.k==="qual") td.innerHTML = '<span class="'+qualClass(r.qual)+'">'+txt+'</span>';
      else td.textContent = txt;
      tr.appendChild(td);
    });
    b.appendChild(tr);
  });
}
render();
